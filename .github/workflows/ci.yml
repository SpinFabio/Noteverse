name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze && flutter test && flutter build web
        working-directory: frontend
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: python3 -m unittest discover -s backend/tests -p stack_smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
