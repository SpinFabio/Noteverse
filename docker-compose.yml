services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Noteverse}
      DATA_DIR: /app/data
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Copia .env.example in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_CONNECTION_TIMEOUT: ${NEO4J_CONNECTION_TIMEOUT:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${HOST_DATA_DIR:-./backend/data}:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 20s

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: '${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Copia .env.example in .env}'
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  neo4j_data:
